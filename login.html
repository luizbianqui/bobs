<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkrest — Entrar</title>
    <meta name="description" content="Acesse o painel de gestão de checklists operacionais Checkrest.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js?v=2"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --color-primary: #2EE6A8;
            --color-primary-hover: #26c38e;
            --color-primary-light: rgba(46, 230, 168, 0.12);
            --color-danger: #ff4d6d;
            --bg-deep: #030d0a;
            --bg-card: rgba(255, 255, 255, 0.04);
            --border: rgba(46, 230, 168, 0.15);
            --text-main: #ffffff;
            --text-muted: rgba(255,255,255,0.5);
            --font: 'Outfit', sans-serif;
        }

        body {
            font-family: var(--font);
            background: var(--bg-deep);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Fundo animado com bolhas */
        .bg-orbs {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.18;
            animation: drift 12s ease-in-out infinite;
        }
        .orb-1 { width: 500px; height: 500px; background: #2EE6A8; top: -150px; left: -150px; animation-delay: 0s; }
        .orb-2 { width: 400px; height: 400px; background: #0ea5e9; bottom: -100px; right: -100px; animation-delay: 4s; }
        .orb-3 { width: 300px; height: 300px; background: #8b5cf6; top: 40%; left: 50%; animation-delay: 8s; }

        @keyframes drift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -20px) scale(1.05); }
            66% { transform: translate(-20px, 30px) scale(0.95); }
        }

        /* Grid de pontinhos no fundo */
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(circle, rgba(46, 230, 168, 0.08) 1px, transparent 1px);
            background-size: 32px 32px;
            z-index: 0;
        }

        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            padding: 24px;
            animation: slideUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Card de login */
        .login-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(46, 230, 168, 0.12);
            border-radius: 24px;
            padding: 40px 40px 36px;
            backdrop-filter: blur(20px);
            box-shadow:
                0 0 0 1px rgba(46, 230, 168, 0.05),
                0 32px 80px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.07);
        }

        /* Logo */
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
            justify-content: center;
        }
        .logo-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #2EE6A8, #0ea5e9);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 800;
            color: #0b2420;
            box-shadow: 0 0 20px rgba(46, 230, 168, 0.35);
        }
        .logo-text {
            font-size: 26px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }
        .logo-text span { color: var(--color-primary); }

        /* Título */
        .login-headline {
            text-align: center;
            margin-bottom: 8px;
        }
        .login-headline h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-main);
        }
        .login-headline p {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Divider */
        .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(46,230,168,0.15), transparent);
            margin: 24px 0;
        }

        /* Formulário */
        .form-group {
            margin-bottom: 16px;
        }
        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }
        .input-wrapper {
            position: relative;
        }
        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            display: flex;
        }
        .form-input {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: var(--text-main);
            font-family: var(--font);
            font-size: 15px;
            font-weight: 500;
            padding: 13px 14px 13px 44px;
            outline: none;
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
        }
        .form-input::placeholder { color: rgba(255,255,255,0.2); }
        .form-input:focus {
            border-color: var(--color-primary);
            background: rgba(46, 230, 168, 0.05);
            box-shadow: 0 0 0 3px rgba(46, 230, 168, 0.1);
        }

        /* Botão de mostrar/ocultar senha */
        .btn-toggle-pass {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            padding: 4px;
            display: flex;
            transition: color 0.2s;
        }
        .btn-toggle-pass:hover { color: var(--text-main); }

        /* Mensagem de erro */
        .error-msg {
            display: none;
            background: rgba(255, 77, 109, 0.1);
            border: 1px solid rgba(255, 77, 109, 0.25);
            border-radius: 10px;
            padding: 12px 16px;
            color: #ff8099;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 16px;
            align-items: center;
            gap: 10px;
        }
        .error-msg.visible { display: flex; }

        /* Botão principal */
        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #2EE6A8, #26c38e);
            border: none;
            border-radius: 12px;
            color: #0b2420;
            font-family: var(--font);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
            box-shadow: 0 4px 20px rgba(46, 230, 168, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
            margin-top: 8px;
        }
        .btn-login:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(46, 230, 168, 0.4);
        }
        .btn-login:active:not(:disabled) { transform: translateY(0); }
        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* Spinner */
        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(11, 36, 32, 0.3);
            border-top-color: #0b2420;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        .spinner.visible { display: block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Rodapé */
        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: rgba(255,255,255,0.25);
        }

        /* Responsivo */
        @media (max-width: 480px) {
            .login-card { padding: 28px 24px; }
        }
    </style>
</head>
<body>
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>
    <div class="bg-grid"></div>

    <div class="login-wrapper">
        <div class="login-card">
            <!-- Logo -->
            <div class="logo-area">
                <div class="logo-icon">C</div>
                <span class="logo-text">check<span>rest</span></span>
            </div>

            <!-- Título -->
            <div class="login-headline">
                <h1>Bem-vindo de volta</h1>
                <p>Acesse o painel de gestão operacional</p>
            </div>

            <div class="divider"></div>

            <!-- Formulário -->
            <form id="form-login" novalidate>
                <div class="form-group">
                    <label class="form-label" for="input-email">E-mail</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                        </span>
                        <input
                            type="email"
                            class="form-input"
                            id="input-email"
                            placeholder="seu@email.com.br"
                            autocomplete="email"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="input-password">Senha</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        </span>
                        <input
                            type="password"
                            class="form-input"
                            id="input-password"
                            placeholder="••••••••"
                            autocomplete="current-password"
                            required
                        >
                        <button type="button" class="btn-toggle-pass" id="btn-toggle-pass" title="Mostrar senha">
                            <svg id="icon-eye" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg id="icon-eye-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
                        </button>
                    </div>
                </div>

                <!-- Erro -->
                <div class="error-msg" id="error-msg">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
                    <span id="error-text">E-mail ou senha incorretos.</span>
                </div>

                <!-- Botão -->
                <button type="submit" class="btn-login" id="btn-login">
                    <div class="spinner" id="login-spinner"></div>
                    <span id="btn-login-text">Entrar no Painel</span>
                </button>
            </form>
        </div>

        <div class="login-footer">
            Checkrest &copy; 2026 &nbsp;·&nbsp; LS Company Comércio de Alimentos LTDA
        </div>
    </div>

    <script>
        // Verificar se já tem sessão ativa → redirecionar direto
        (async () => {
            if (!window.isSupabaseConfigured || !window.isSupabaseConfigured()) return;
            try {
                const client = supabase.createClient(
                    window.getSupabaseCreds().url,
                    window.getSupabaseCreds().key
                );
                const { data: { session } } = await client.auth.getSession();
                if (session) {
                    window.location.replace('index.html');
                }
            } catch (e) {}
        })();

        // Toggle visibilidade da senha
        const passInput = document.getElementById('input-password');
        const iconEye = document.getElementById('icon-eye');
        const iconEyeOff = document.getElementById('icon-eye-off');
        document.getElementById('btn-toggle-pass').addEventListener('click', () => {
            const isPass = passInput.type === 'password';
            passInput.type = isPass ? 'text' : 'password';
            iconEye.style.display = isPass ? 'none' : 'block';
            iconEyeOff.style.display = isPass ? 'block' : 'none';
        });

        // Submissão do formulário
        const form = document.getElementById('form-login');
        const btnLogin = document.getElementById('btn-login');
        const btnText = document.getElementById('btn-login-text');
        const spinner = document.getElementById('login-spinner');
        const errorMsg = document.getElementById('error-msg');
        const errorText = document.getElementById('error-text');

        function showError(msg) {
            errorText.textContent = msg;
            errorMsg.classList.add('visible');
        }
        function hideError() {
            errorMsg.classList.remove('visible');
        }
        function setLoading(on) {
            btnLogin.disabled = on;
            spinner.classList.toggle('visible', on);
            btnText.textContent = on ? 'Entrando...' : 'Entrar no Painel';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();

            const email = document.getElementById('input-email').value.trim();
            const pass = document.getElementById('input-password').value;

            if (!email || !pass) {
                showError('Por favor, preencha e-mail e senha.');
                return;
            }

            if (!window.isSupabaseConfigured || !window.isSupabaseConfigured()) {
                showError('Supabase não configurado. Contate o administrador.');
                return;
            }

            setLoading(true);
            try {
                const client = supabase.createClient(
                    window.getSupabaseCreds().url,
                    window.getSupabaseCreds().key
                );
                const { data, error } = await client.auth.signInWithPassword({ email, password: pass });
                if (error) throw error;
                // Limpa cache de usuário para forçar recarga
                localStorage.removeItem('checkrest_user');
                window.location.replace('index.html');
            } catch (err) {
                const msg = err.message || '';
                if (msg.includes('Invalid login') || msg.includes('credentials') || msg.includes('password')) {
                    showError('E-mail ou senha incorretos. Tente novamente.');
                } else if (msg.includes('Email not confirmed')) {
                    showError('E-mail ainda não confirmado. Verifique sua caixa de entrada.');
                } else {
                    showError('Erro ao entrar: ' + msg);
                }
                setLoading(false);
            }
        });

        // Foco automático no campo de e-mail
        document.getElementById('input-email').focus();
    </script>
</body>
</html>
